name: Release

# A tag vX.Y.Z runs the tests, rebuilds the release tarball that the one-line installer downloads, checks that it
# matches the sha256 pinned in install.sh (scripts/release.sh writes that pin before the tag is made), and publishes it
# with its sha256 and the CHANGELOG section of the version as notes.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the tarball and check it matches the pin in install.sh
        run: scripts/release.sh --build-only "${TAG#v}"
      - name: Create the release
        run: |
          version="${TAG#v}"
          flags=()
          if [[ "$TAG" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "dist/ibus-llm-assist-$version.tar.gz" "dist/ibus-llm-assist-$version.tar.gz.sha256" \
            --verify-tag --title "$TAG" --notes-file dist/notes.md "${flags[@]}"
