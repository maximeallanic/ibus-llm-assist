name: Release

# A tag vX.Y.Z runs the tests, checks that every version string and the CHANGELOG agree with it, and publishes a
# GitHub release with the source archive and its sha256. The one-line installer downloads GitHub's archive of the
# tag; the SHA256SUMS file lets people pin it with IBUS_LLM_ASSIST_SHA256.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the version of the code
        run: |
          version="${TAG#v}"
          grep -qx "IBLA_VERSION=$version" lib/common.sh
          grep -qx "IBLA_RELEASE=$TAG" install.sh
          grep -q "^## \[$version\] - " CHANGELOG.md
      - name: Source archive, checksum and notes
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="ibus-llm-assist-${TAG#v}/" -o "dist/ibus-llm-assist-${TAG#v}.tar.gz" "$TAG"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create the release
        run: |
          flags=()
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"
